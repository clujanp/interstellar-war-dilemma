version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interstellar-war-dilemma
    ports:
      - "8081:8081"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
